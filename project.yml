name: Ream
options:
  bundleIdPrefix: com.shimondeitel.ream
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Ream:
    type: application
    platform: iOS
    sources:
      - path: Ream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.ream
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Ream/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  ReamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReamTests
      - path: Ream.storekit
    dependencies:
      - target: Ream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.ream.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  ReamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReamUITests
    dependencies:
      - target: Ream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.ream.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Ream:
    build:
      targets:
        Ream: all
        ReamTests: [test]
        ReamUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Ream.storekit
    test:
      config: Debug
      storeKitConfiguration: Ream.storekit
      targets:
        - ReamTests
        - ReamUITests
    archive:
      config: Release
